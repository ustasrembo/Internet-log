
name: Build Internet Log APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/InternetLog/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }''',
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p extracted/InternetLog assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: InternetLog-APK
          path: extracted/InternetLog/app/build/outputs/apk/debug/app-debug.apk
